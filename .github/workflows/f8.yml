name: F8 AAVE 4h
on:
  schedule:
    - cron: "3 0 * * *"                 # 7h03 sáng VN: kiểm tra kèo + gửi trạng thái hằng ngày
    - cron: "3 1-23 * * *"              # 3 phút sau mỗi nến 1h đóng (kèo 4h chỉ báo ở lượt ngay sau nến 4h đóng)
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy matplotlib
      - name: Kiểm tra kèo F8
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VON: ${{ vars.VON || '1000' }}
          VOL_1H: ${{ vars.VOL_1H || '200' }}
          PAPER_START: ${{ vars.PAPER_START || '2026-11-23' }}
          STATUS: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '3 0 * * *') && '1' || '0' }}
        run: python f8_alert.py
