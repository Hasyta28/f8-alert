name: F8 AAVE 4h
on:
  schedule:
    - cron: "3 0 * * *"                 # 7h03 sáng VN: kiểm tra kèo + gửi trạng thái hằng ngày
    - cron: "3 4,8,12,16,20 * * *"      # 3 phút sau các nến 4h còn lại (11h, 15h, 19h, 23h, 3h giờ VN)
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy
      - name: Kiểm tra kèo F8
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VON: ${{ vars.VON || '1000' }}
          STATUS: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '3 0 * * *') && '1' || '0' }}
        run: python f8_alert.py
