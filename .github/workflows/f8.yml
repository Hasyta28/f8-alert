name: F8 AAVE 4h
on:
  schedule:
    - cron: "3,18,33,48 * * * *"        # 3 phút sau mỗi nến m15 đóng; kèo 1h/4h và bản tin 7h sáng tự lọc theo cửa sổ thời gian, không gửi trùng
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas numpy matplotlib
      - name: Kiểm tra kèo F8
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_4H: ${{ vars.CHAT_4H || '-5288256918' }}
          CHAT_1H: ${{ vars.CHAT_1H || '-5244325452' }}
          CHAT_15M: ${{ vars.CHAT_15M }}
          CHAT_PAPER: ${{ vars.CHAT_PAPER || '-5523255894' }}
          PAPER_START: ${{ vars.PAPER_START || '2026-11-23' }}
          VOL_MULTI: ${{ vars.VOL_MULTI || '100' }}
          VON: ${{ vars.VON || '1000' }}
          VOL_1H: ${{ vars.VOL_1H || '200' }}
          STATUS: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python f8_alert.py
